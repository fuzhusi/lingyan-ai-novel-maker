<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#120c0a">
    <title>{% block title %}AI 小说创作系统{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
    <script type="importmap">
    { "imports": { "three": "/static/vendor/three.module.min.js" } }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- 大气层：CSS 极光斑垫底 + WebGL 环境流光（aurora.js 挂载） -->
    <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
    <header class="topbar">
        <a href="/" class="logo"><span class="seal">砚</span><span>灵砚</span></a>
        <nav>
            {% block nav %}{% endblock %}
        </nav>
        <nav class="topbar-nav">
            <a href="/novel/">长篇</a>
            <a href="/short/">短篇</a>
            <span class="nav-sep" aria-hidden="true"></span>
            <a href="/plagiarize/">借鉴</a>
            <span class="nav-sep" aria-hidden="true"></span>
            <a href="/settings/">设置</a>
            <a href="/api/skills/page">技巧</a>
            <a href="/prompt-templates/">模板</a>
        </nav>
        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="菜单">&#9776;</button>
    </header>

    <!-- 移动端菜单 -->
    <div class="mobile-menu" id="mobile-menu">
        <a href="/novel/">长篇</a>
        <a href="/short/">短篇</a>
        <a href="/plagiarize/">借鉴</a>
        <a href="/settings/">设置</a>
        <a href="/api/skills/page">技巧</a>
        <a href="/prompt-templates/">模板</a>
    </div>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    <footer style="text-align:center;padding:2rem;color:var(--text-faint);font-size:0.78rem;letter-spacing:0.28em">
        &mdash; 笔落惊风雨，墨染见天机 &mdash;
    </footer>
    {% block scripts %}{% endblock %}
<script type="module" src="/static/js/aurora.js"></script>
<script>
// 移动端菜单切换
(function() {
    const btn = document.getElementById('mobile-menu-btn');
    const menu = document.getElementById('mobile-menu');
    if (!btn || !menu) return;
    btn.addEventListener('click', function(e) {
        e.stopPropagation();
        menu.classList.toggle('open');
    });
    // 点击菜单外区域关闭
    document.addEventListener('click', function(e) {
        if (menu.classList.contains('open') && !menu.contains(e.target)) {
            menu.classList.remove('open');
        }
    });
    // Esc 关闭
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') menu.classList.remove('open');
    });
})();

// 书脊导航高亮当前页
(function() {
    var path = location.pathname;
    document.querySelectorAll('.topbar-nav a').forEach(function(a) {
        var href = a.getAttribute('href');
        var hit = href === '/' ? path === '/' : path === href || path.startsWith(href);
        if (hit) a.classList.add('active');
    });
})();

// 流光聚光 — 指针位置写入 CSS 变量，卡片悬停时一汪柔光跟随光标
(function() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (!window.matchMedia('(hover: hover)').matches) return;
    var selector = '.card, .novel-card, .chapter-card, .card-item, .outline-item, .sidebar-card, .mode-card';
    var raf = 0, ev = null;
    document.addEventListener('pointermove', function(e) {
        ev = e;
        if (raf) return;
        raf = requestAnimationFrame(function() {
            raf = 0;
            var el = ev.target && ev.target.closest ? ev.target.closest(selector) : null;
            if (!el) return;
            var rect = el.getBoundingClientRect();
            el.style.setProperty('--mx', (ev.clientX - rect.left) + 'px');
            el.style.setProperty('--my', (ev.clientY - rect.top) + 'px');
        });
    }, { passive: true });
})();
</script>
<style>
/* 移动端响应式 (P2-3) */
@media (max-width: 768px) {
    .topbar { flex-wrap: wrap; padding: 0.6rem 0.8rem !important; }
    .topbar .logo { font-size: 1rem; }
    .topbar-nav { display: none; }
    .mobile-menu-btn { display: inline-flex; align-items: center; margin-left: auto; }
    .topbar-nav { gap: 0.5rem; }
    .nav-sep { width: 1px; height: 14px; background: var(--border); align-self: center; opacity: .7; }
    .topbar-nav a, .user-link, .login-link, .user-name { display: none; }
    .mobile-menu-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.3rem 0.6rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1.2rem;
    }
    .mobile-menu {
        display: none;
        position: fixed;
        top: 50px;
        right: 0;
        background: rgba(26, 17, 13, 0.96);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--border-light);
        border-radius: 10px;
        padding: 0.5rem 0;
        min-width: 180px;
        box-shadow: 0 12px 36px rgba(2, 6, 18, 0.65), 0 0 24px rgba(93, 211, 241, 0.06);
        z-index: 100;
    }
    .mobile-menu.open { display: block; }
    .mobile-menu a {
        display: block;
        padding: 0.6rem 1rem;
        color: var(--text);
        text-decoration: none;
        font-size: 0.92rem;
        transition: background 0.2s ease, color 0.2s ease;
    }
    .mobile-menu a:hover {
        background: linear-gradient(90deg, rgba(93, 211, 241, 0.12), transparent);
        color: var(--text-bright);
    }
    .main-content { padding: 1rem !important; }
    .container { padding: 0 !important; }
    /* 仪表盘统计卡片在小屏幕上 2 列布局 */
    [style*="grid-template-columns:repeat(auto-fit, minmax(160px, 1fr))"] {
        grid-template-columns: repeat(2, 1fr) !important;
    }
}
@media (min-width: 769px) {
    .mobile-menu-btn { display: none; }
    .mobile-menu { display: none !important; }
}
</style>
</body>
</html>
