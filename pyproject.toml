[project]
name = "lingyan"
version = "3.0.0"
description = "灵砚 (LingYan) — AI 小说创作系统，支持长篇和短篇创作，多 Agent 协作，17 维度质量审计"
# readme = "README.md"
license = {text = "CC-BY-NC-SA-4.0"}
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1",
    "flask-sqlalchemy>=3.1",
    "sqlalchemy>=2.0",
    "httpx>=0.28",
    "langchain>=1.0",
    "langchain-openai>=0.3",
    "python-dotenv>=1.0",
    "mcp>=1.0,<2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "werkzeug>=3.1",
    "jinja2>=3.1",
    "click>=8.0",
    "markupsafe>=3.0",
    "itsdangerous>=2.2",
    "blinker>=1.9",
    "certifi>=2026.0",
]

[project.optional-dependencies]
docx = ["python-docx>=1.0"]
epub = ["ebooklib>=0.18"]
export = ["python-docx>=1.0", "ebooklib>=0.18"]
all = ["python-docx>=1.0", "ebooklib>=0.18"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
lingyan = "run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]

[tool.hatch.build.targets.wheel]
packages = ["app"]
